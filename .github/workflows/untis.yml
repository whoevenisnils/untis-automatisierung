name: Untis Check

on:
  schedule:
    - cron: '*/15 * * * *' # Läuft alle 15 Minuten
  workflow_dispatch:

permissions:
  contents: write # Wichtig, damit der Bot die Datei speichern darf

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          pip install webuntis requests

      - name: Bot ausführen
        env:
          UNTIS_USER: ${{ secrets.UNTIS_USER }}
          UNTIS_PASSWORD: ${{ secrets.UNTIS_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python bot.py

      - name: Stundenplan-Zustand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_timetable.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last timetable state" && git push)
